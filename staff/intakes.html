<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff · Customer Intakes</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E1729;
      color: #fff;
      min-height: 100vh;
      padding: 24px 20px 80px;
    }
    main { max-width: 1280px; margin: 0 auto; }

    header.page {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { color: #9CA3AF; font-size: 14px; margin: 0 0 24px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      border: 1px solid #2A3654;
      background: #1F2D4F;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { border-color: #C9A961; }
    .btn-primary { background: #C9A961; color: #0E1729; border-color: #C9A961; }
    .btn-primary:hover { background: #D4B775; }

    .auth-gate { background: #1F2D4F; border: 1px solid #2A3654; border-radius: 4px; padding: 24px; max-width: 480px; }
    .auth-gate label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #C9A961; margin-bottom: 6px; }
    .auth-gate input { width: 100%; padding: 14px; font-family: 'Courier New', monospace; font-size: 16px; background: #0E1729; color: #fff; border: 1px solid #2A3654; border-radius: 4px; margin-bottom: 12px; }
    .auth-gate button { padding: 12px 20px; background: #C9A961; color: #0E1729; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; }

    .alert { padding: 12px 16px; border-radius: 4px; margin: 16px 0; }
    .alert.error { background: #4A1E1B; color: #FBE9E7; }
    .alert.success { background: #1B3A2A; color: #DFF5E8; }

    /* Filter bar */
    .filterbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      padding: 14px;
      background: #1F2D4F;
      border: 1px solid #2A3654;
      border-radius: 4px;
    }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill-btn {
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid #2A3654;
      background: transparent;
      color: #9CA3AF;
      cursor: pointer;
    }
    .pill-btn:hover { color: #fff; }
    .pill-btn.is-active { background: #C9A961; color: #0E1729; border-color: #C9A961; }
    .filterbar .search {
      flex: 1;
      min-width: 200px;
      padding: 9px 14px;
      font-size: 14px;
      background: #0E1729;
      color: #fff;
      border: 1px solid #2A3654;
      border-radius: 4px;
    }
    .filterbar .count { color: #9CA3AF; font-size: 13px; }

    /* Table */
    .table-wrap { overflow-x: auto; border: 1px solid #2A3654; border-radius: 4px; background: #14213D; }
    table { width: 100%; border-collapse: collapse; min-width: 920px; }
    thead th {
      background: #1F2D4F;
      color: #9CA3AF;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid #2A3654;
      white-space: nowrap;
    }
    tbody td {
      padding: 14px;
      border-bottom: 1px solid #1F2D4F;
      vertical-align: top;
      font-size: 14px;
    }
    tbody tr:hover { background: #1F2D4F; }
    tbody tr.is-urgent td:first-child { border-left: 3px solid #C9A961; padding-left: 11px; }
    tbody tr.is-overdue td:first-child { border-left: 3px solid #FF6B6B; padding-left: 11px; }

    .customer { display: flex; flex-direction: column; gap: 2px; }
    .customer .name { font-weight: 700; color: #fff; }
    .customer .id { font-family: 'Courier New', monospace; font-size: 11px; color: #6B7280; }
    .contact { display: flex; flex-direction: column; gap: 4px; }
    .contact a { color: #C9A961; text-decoration: none; font-size: 13px; }
    .contact a:hover { text-decoration: underline; }
    .suit { display: flex; flex-direction: column; gap: 2px; }
    .suit .size { font-weight: 700; }
    .suit .color { color: #9CA3AF; font-size: 13px; }
    .notes { color: #E5E7EB; font-size: 13px; line-height: 1.4; max-width: 280px; white-space: pre-wrap; }
    .notes-extra { color: #9CA3AF; font-size: 12px; line-height: 1.4; max-width: 280px; white-space: pre-wrap; margin-top: 4px; font-style: italic; }
    .ticket-num { font-family: 'Courier New', monospace; font-size: 14px; color: #C9A961; font-weight: 700; }
    .ticket-num.empty { color: #4B5563; font-weight: 400; }
    .date-cell .primary { font-weight: 700; }
    .date-cell .relative { color: #9CA3AF; font-size: 12px; margin-top: 2px; }
    .date-cell .relative.urgent { color: #C9A961; }
    .date-cell .relative.overdue { color: #FF6B6B; }

    .status-select {
      background: #0E1729;
      color: #fff;
      border: 1px solid #2A3654;
      border-radius: 4px;
      padding: 7px 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-width: 130px;
    }
    .status-select.s-pending { color: #FBBF24; border-color: #6B5A18; }
    .status-select.s-sent { color: #93C5FD; border-color: #1E40AF; }
    .status-select.s-back { color: #6EE7B7; border-color: #064E3B; }
    .status-select.s-picked_up { color: #9CA3AF; border-color: #2A3654; }

    .btn-notify {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 4px;
      border: 1px solid #C9A961;
      background: #C9A961;
      color: #0E1729;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-notify:hover:not(:disabled) { background: #D4B775; border-color: #D4B775; }
    .btn-notify:disabled { opacity: 0.6; cursor: wait; }
    .notice-sent {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #6EE7B7;
      font-size: 12px;
      font-weight: 600;
    }
    .notify-na { color: #4B5563; font-size: 13px; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9CA3AF;
    }
    .empty .big { font-size: 18px; color: #fff; margin-bottom: 8px; }

    .footer { margin-top: 32px; text-align: center; }
    .footer a { color: #9CA3AF; text-decoration: none; padding: 8px 16px; border: 1px solid #2A3654; border-radius: 4px; font-size: 14px; margin: 0 4px; }
  </style>
</head>
<body>
  <main>
    <header class="page">
      <div>
        <h1>Customer Intakes</h1>
        <p class="subtitle">In-store tailoring intakes — sorted by need-by date.</p>
      </div>
      <div class="actions" data-region="actions">
        <button class="btn" data-action="refresh">↻ Refresh</button>
        <button class="btn" data-action="download-csv">Download CSV</button>
      </div>
    </header>

    <div class="alert error" data-region="alert" hidden></div>

    <section data-region="dashboard">
      <div class="filterbar">
        <div class="pills" data-region="status-pills">
          <button class="pill-btn is-active" data-status="pending">Pending</button>
          <button class="pill-btn" data-status="sent">Sent to tailor</button>
          <button class="pill-btn" data-status="back">Back from tailor</button>
          <button class="pill-btn" data-status="picked_up">Picked up</button>
          <button class="pill-btn" data-status="all">All</button>
        </div>
        <input class="search" data-region="search" placeholder="Search name, phone, or email…" />
        <span class="count" data-region="count">—</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Ticket #</th>
              <th>Contact</th>
              <th>Tailoring</th>
              <th>Need by</th>
              <th>Status</th>
              <th>Notify</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody data-region="rows"></tbody>
        </table>
      </div>
      <div class="empty" data-region="empty" hidden>
        <div class="big">No intakes match these filters</div>
        <div>Try switching to "All" or clearing the search box.</div>
      </div>
    </section>

    <div class="footer">
      <a href="/staff/redeem.html">Redeem</a>
      <a href="/staff/stats.html">Stats</a>
      <a href="/intake/">Open intake form ↗</a>
    </div>
  </main>

  <script src="/assets/js/staff.js" defer></script>
  <script src="/assets/js/staff-intakes.js" defer></script>
</body>
</html>
