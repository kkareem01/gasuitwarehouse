<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff · Funnel Stats</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E1729;
      color: #fff;
      min-height: 100vh;
      padding: 24px 20px 80px;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .subtitle { color: #9CA3AF; margin: 0 0 24px; font-size: 14px; }
    .auth-gate { background: #1F2D4F; border: 1px solid #2A3654; border-radius: 4px; padding: 24px; max-width: 480px; }
    .auth-gate input {
      width: 100%; padding: 14px; font-family: 'Courier New', monospace; font-size: 16px;
      background: #0E1729; color: #fff; border: 1px solid #2A3654; border-radius: 4px; margin: 12px 0;
    }
    .auth-gate button { padding: 12px 20px; background: #C9A961; color: #0E1729; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; }
    .alert { padding: 12px 16px; border-radius: 4px; margin: 16px 0; }
    .alert.error { background: #4A1E1B; color: #FBE9E7; }
    .week-card {
      background: #1F2D4F;
      border: 1px solid #2A3654;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .week-card.active { border-left: 3px solid #C9A961; }
    .week-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .week-name { font-size: 17px; font-weight: 600; }
    .week-dates { font-size: 13px; color: #9CA3AF; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .stat {
      background: #14213D;
      border: 1px solid #2A3654;
      border-radius: 4px;
      padding: 12px 14px;
    }
    .stat .label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #9CA3AF; }
    .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .stat.highlight .value { color: #C9A961; }
    .conv-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2A3654;
      font-size: 13px;
    }
    .conv-row > div .k { color: #9CA3AF; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
    .conv-row > div .v { font-size: 16px; font-weight: 700; color: #fff; margin-top: 2px; }
    .footer { margin-top: 40px; text-align: center; }
    .footer a { color: #9CA3AF; text-decoration: none; padding: 8px 16px; border: 1px solid #2A3654; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Funnel Stats</h1>
    <p class="subtitle" data-region="subtitle">Per-week opt-in to redeemed conversion.</p>

    <section class="auth-gate" data-region="auth-gate" hidden>
      <label for="staff-token">Staff token</label>
      <input id="staff-token" type="password" placeholder="Paste token" autocomplete="off" />
      <button data-action="save-token">Load Stats</button>
    </section>

    <div class="alert error" data-region="alert" hidden></div>

    <div data-region="weeks"></div>

    <div class="footer">
      <a href="/staff/redeem.html">← Back to redeem tool</a>
    </div>
  </main>

  <script src="/assets/js/staff.js" defer></script>
  <script src="/assets/js/staff-stats.js" defer></script>
</body>
</html>
